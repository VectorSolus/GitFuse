name: release-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    env:
      GITFUSE_RELEASE_RELAY_URL: https://relay.gitfuse.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: apps/cli/go.sum

      - name: Validate release relay URL gate
        run: scripts/validate-release-relay-url.sh

      - name: Test CLI
        working-directory: apps/cli
        run: go test ./...

      - name: Vet CLI
        working-directory: apps/cli
        run: go vet ./...

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
