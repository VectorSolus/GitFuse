name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITFUSE_RELEASE_RELAY_URL: ${{ vars.GITFUSE_RELEASE_RELAY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: apps/cli/go.sum

      - name: Validate production relay URL
        run: scripts/validate-release-relay-url.sh

      - name: Test CLI
        working-directory: apps/cli
        run: go test ./...

      - name: Vet CLI
        working-directory: apps/cli
        run: go vet ./...

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - name: GoReleaser release
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
        with:
          version: "~> v2"
          args: release --clean
