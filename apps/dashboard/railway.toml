[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --dir apps/dashboard build"
watchPatterns = [
  "apps/dashboard/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
startCommand = "pnpm --dir apps/dashboard start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
